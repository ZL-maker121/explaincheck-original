<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#51757b"/></marker><style>.title{font:700 32px Arial,sans-serif;fill:#143943}.sub{font:16px Arial,sans-serif;fill:#617c82}.heading{font:700 20px Arial,sans-serif;fill:#173b45}.body{font:15px Arial,sans-serif;fill:#4e6970}.tag{font:700 12px Arial,sans-serif;letter-spacing:1px;fill:#fff}.flow{font:14px Arial,sans-serif;fill:#47676d}</style></defs>
  <rect width="1400" height="820" rx="28" fill="#f5f8f7"/>
  <text x="60" y="65" class="title">ExplainCheck — system architecture</text>
  <text x="60" y="95" class="sub">Original browser-only prototype · keyword suggestions and rule score are not trained-model outputs</text>
  <rect x="70" y="145" width="1260" height="120" rx="20" fill="#ffffff" stroke="#d7e4e2" stroke-width="2"/>
