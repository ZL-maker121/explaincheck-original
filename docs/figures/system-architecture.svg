  <text x="75" y="619" class="heading">Scenario bank</text><text x="75" y="647" class="body">6 fictional tickets</text><text x="75" y="671" class="body">Hidden reference queue</text>
  <rect x="365" y="540" width="285" height="150" rx="18" fill="#fff" stroke="#d7e4e2" stroke-width="2"/>
  <rect x="385" y="560" width="112" height="28" rx="14" fill="#167b75"/><text x="441" y="579" text-anchor="middle" class="tag">IMPLEMENTED</text>
  <text x="385" y="619" class="heading">Keyword engine</text><text x="385" y="647" class="body">Weighted text cues</text><text x="385" y="671" class="body">Label + heuristic score</text>
  <rect x="675" y="540" width="285" height="150" rx="18" fill="#fff" stroke="#d7e4e2" stroke-width="2"/>
  <rect x="695" y="560" width="112" height="28" rx="14" fill="#167b75"/><text x="751" y="579" text-anchor="middle" class="tag">IMPLEMENTED</text>
  <text x="695" y="619" class="heading">Decision evaluator</text><text x="695" y="647" class="body">User vs AI vs reference</text><text x="695" y="671" class="body">Correctness + avoided errors</text>
