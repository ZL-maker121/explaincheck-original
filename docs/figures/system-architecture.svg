  <text x="300" y="363" class="heading">HTML + CSS + JavaScript interaction layer</text>
  <text x="300" y="396" class="body">Case queue · recommendation card · on-demand explanation · decision controls · feedback form</text>
  <text x="300" y="423" class="body">Session summary · CSV export · local reset/clear · keyboard focus and status messages</text>
