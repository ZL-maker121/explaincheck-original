<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
 <defs><style>.t{font:700 28px Arial,sans-serif;fill:#173b45}.s{font:15px Arial,sans-serif;fill:#607b81}.h{font:700 18px Arial,sans-serif;fill:#173b45}.b{font:14px Arial,sans-serif;fill:#4b6870}.mini{font:12px Arial,sans-serif;fill:#167b75;font-weight:700}.num{font:700 14px Arial,sans-serif;fill:white}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c9594"/></marker></defs>
 <rect width="1500" height="620" rx="25" fill="#f5f8f7"/><text x="45" y="55" class="t">Storyboard 1 — review a recommendation</text><text x="45" y="84" class="s">Scenario: duplicate charge · the rule-based suggestion matches the reference answer</text>
 <g transform="translate(45,125)"><rect width="430" height="420" rx="19" fill="#fff" stroke="#d7e4e2" stroke-width="2"/><circle cx="34" cy="35" r="16" fill="#167b75"/><text x="34" y="40" text-anchor="middle" class="num">1</text><text x="62" y="41" class="h">Choose a sample ticket</text><rect x="22" y="73" width="386" height="108" rx="12" fill="#f7faf9" stroke="#e2ece9"/><text x="42" y="101" class="mini">EC-01 · EASY CASE</text><text x="42" y="129" class="h">The same plan was charged twice</text><text x="42" y="154" class="b">“I can see two charges for the same plan…”</text><rect x="22" y="205" width="386" height="80" rx="12" fill="#edf5f8" stroke="#d9e8ed"/><text x="42" y="230" class="mini" style="fill:#2b6879">RULE-BASED SUGGESTION</text><text x="42" y="260" class="h">Billing <tspan fill="#2b6879">· score 92</tspan></text><text x="22" y="327" class="b">User action: reads the ticket and suggestion.</text><text x="22" y="355" class="b">System response: keeps the reference answer hidden.</text><text x="22" y="389" class="s">Principle: visibility of system status</text></g>
 <path d="M490 335 H525" stroke="#6c9594" stroke-width="3" marker-end="url(#a)"/>
 <g transform="translate(535,125)"><rect width="430" height="420" rx="19" fill="#fff" stroke="#d7e4e2" stroke-width="2"/><circle cx="34" cy="35" r="16" fill="#167b75"/><text x="34" y="40" text-anchor="middle" class="num">2</text><text x="62" y="41" class="h">Inspect the explanation</text><rect x="22" y="74" width="386" height="163" rx="12" fill="#f7fbf9" stroke="#cce4dc"/><text x="42" y="102" class="mini">REVEALED EXPLANATION</text><rect x="42" y="119" width="117" height="27" rx="7" fill="#e2f2ec"/><text x="100" y="137" text-anchor="middle" class="b">Two charges</text><rect x="168" y="119" width="127" height="27" rx="7" fill="#e2f2ec"/><text x="231" y="137" text-anchor="middle" class="b">Same monthly plan</text><text x="42" y="177" class="b">The example highlights duplicate-payment cues.</text><text x="42" y="203" class="b">Limit: it cannot inspect a real payment ledger.</text><text x="22" y="280" class="b">User action: opens “Reveal explanation”.</text><text x="22" y="308" class="b">System response: displays cues and limitation.</text><text x="22" y="355" class="b">User chooses Billing or another queue.</text><text x="22" y="389" class="s">Principle: progressive disclosure</text></g>
 <path d="M980 335 H1015" stroke="#6c9594" stroke-width="3" marker-end="url(#a)"/>
 <g transform="translate(1025,125)"><rect width="430" height="420" rx="19" fill="#fff" stroke="#d7e4e2" stroke-width="2"/><circle cx="34" cy="35" r="16" fill="#167b75"/><text x="34" y="40" text-anchor="middle" class="num">3</text><text x="62" y="41" class="h">Submit and compare</text><rect x="22" y="75" width="386" height="110" rx="12" fill="#edf8f2" stroke="#c6e6d5"/><text x="42" y="105" class="mini">REFERENCE ANSWER REVEALED</text><text x="42" y="137" class="h">Billing · matches</text><text x="42" y="161" class="b">Both AI and user decision are correct.</text><text x="22" y="231" class="b">User action: submits the route decision.</text><text x="22" y="261" class="b">System response: compares choices to reference.</text><text x="22" y="291" class="b">Next: optionally rate explanation usefulness.</text><text x="22" y="356" class="b">The result is a scenario check, not a user study.</text><text x="22" y="389" class="s">Principle: feedback and error recovery</text></g>
</svg>
