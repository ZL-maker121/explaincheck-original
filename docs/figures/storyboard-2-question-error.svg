<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
 <defs><style>.t{font:700 28px Arial,sans-serif;fill:#173b45}.s{font:15px Arial,sans-serif;fill:#607b81}.h{font:700 18px Arial,sans-serif;fill:#173b45}.b{font:14px Arial,sans-serif;fill:#4b6870}.mini{font:12px Arial,sans-serif;fill:#167b75;font-weight:700}.num{font:700 14px Arial,sans-serif;fill:white}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c9594"/></marker></defs>
 <rect width="1500" height="620" rx="25" fill="#f5f8f7"/><text x="45" y="55" class="t">Storyboard 2 — question an incorrect recommendation</text><text x="45" y="84" class="s">Scenario: a cancelled subscription is still charged · the rule engine suggests Account, reference answer is Billing</text>
 <g transform="translate(45,125)"><rect width="430" height="420" rx="19" fill="#fff" stroke="#d7e4e2" stroke-width="2"/><circle cx="34" cy="35" r="16" fill="#167b75"/><text x="34" y="40" text-anchor="middle" class="num">1</text><text x="62" y="41" class="h">Notice ambiguity</text><rect x="22" y="75" width="386" height="107" rx="12" fill="#f7faf9" stroke="#e2ece9"/><text x="42" y="104" class="mini">EC-03 · HARD CASE</text><text x="42" y="131" class="h">Cancelled but still charged</text><text x="42" y="155" class="b">The plan is inactive, but a payment was taken.</text><rect x="22" y="206" width="386" height="79" rx="12" fill="#edf5f8" stroke="#d9e8ed"/><text x="42" y="231" class="mini" style="fill:#2b6879">RULE-BASED SUGGESTION</text><text x="42" y="261" class="h">Account · score 61</text><text x="22" y="327" class="b">User action: notices both account and payment cues.</text><text x="22" y="355" class="b">System response: presents an uncertain suggestion.</text><text x="22" y="389" class="s">Principle: match system to task context</text></g>
 <path d="M490 335 H525" stroke="#6c9594" stroke-width="3" marker-end="url(#a)"/>
 <g transform="translate(535,125)"><rect width="430" height="420" rx="19" fill="#fff" stroke="#d7e4e2" stroke-width="2"/><circle cx="34" cy="35" r="16" fill="#167b75"/><text x="34" y="40" text-anchor="middle" class="num">2</text><text x="62" y="41" class="h">Check evidence and limits</text><rect x="22" y="74" width="386" height="167" rx="12" fill="#fff8ed" stroke="#f0ddbb"/><text x="42" y="102" class="mini" style="fill:#8b6427">EXPLANATION LIMITATION</text><text x="42" y="130" class="b">The cues emphasise the inactive account</text><text x="42" y="153" class="b">but may underweight the renewal payment.</text><text x="42" y="189" class="b">The prototype cannot verify a real transaction.</text><text x="42" y="218" class="b">A human should inspect the conflicting clue.</text><text x="22" y="282" class="b">User action: compares the ticket to the reason.</text><text x="22" y="310" class="b">System response: explicitly states a limitation.</text><text x="22" y="357" class="b">User chooses Billing instead of Account.</text><text x="22" y="389" class="s">Principle: user control and informed override</text></g>
 <path d="M980 335 H1015" stroke="#6c9594" stroke-width="3" marker-end="url(#a)"/>
 <g transform="translate(1025,125)"><rect width="430" height="420" rx="19" fill="#fff" stroke="#d7e4e2" stroke-width="2"/><circle cx="34" cy="35" r="16" fill="#167b75"/><text x="34" y="40" text-anchor="middle" class="num">3</text><text x="62" y="41" class="h">Compare after commitment</text><rect x="22" y="75" width="386" height="114" rx="12" fill="#edf8f2" stroke="#c6e6d5"/><text x="42" y="105" class="mini">REFERENCE ANSWER</text><text x="42" y="137" class="h">Billing · your choice matches</text><text x="42" y="162" class="b">The user avoided this rule-based suggestion error.</text><text x="22" y="235" class="b">System records user choice and AI correctness.</text><text x="22" y="265" class="b">It does not claim the model has learned.</text><text x="22" y="295" class="b">The user can rate the explanation and reason.</text><text x="22" y="356" class="b">The label “hard” is illustrative, not validated.</text><text x="22" y="389" class="s">Principle: observable feedback</text></g>
</svg>
