<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
 <defs><style>.t{font:700 28px Arial,sans-serif;fill:#173b45}.s{font:15px Arial,sans-serif;fill:#607b81}.h{font:700 18px Arial,sans-serif;fill:#173b45}.b{font:14px Arial,sans-serif;fill:#4b6870}.mini{font:12px Arial,sans-serif;fill:#167b75;font-weight:700}.num{font:700 14px Arial,sans-serif;fill:white}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6c9594"/></marker></defs>
 <rect width="1500" height="620" rx="25" fill="#f5f8f7"/><text x="45" y="55" class="t">Storyboard 3 — send feedback and inspect the record</text><text x="45" y="84" class="s">Scenario: after reviewing the decision, the user rates the explanation and adds optional comments</text>
 <g transform="translate(45,125)"><rect width="430" height="420" rx="19" fill="#fff" stroke="#d7e4e2" stroke-width="2"/><circle cx="34" cy="35" r="16" fill="#167b75"/><text x="34" y="40" text-anchor="middle" class="num">1</text><text x="62" y="41" class="h">Rate usefulness</text><text x="22" y="90" class="mini">AFTER A DECISION IS SUBMITTED</text><rect x="22" y="112" width="386" height="105" rx="12" fill="#f7faf9" stroke="#e2ece9"/><circle cx="46" cy="144" r="7" fill="#167b75"/><text x="62" y="149" class="b">Helpful</text><circle cx="46" cy="175" r="7" fill="white" stroke="#9eb2b7" stroke-width="2"/><text x="62" y="180" class="b">Partly helpful</text><circle cx="226" cy="175" r="7" fill="white" stroke="#9eb2b7" stroke-width="2"/><text x="242" y="180" class="b">Not helpful</text><text x="22" y="268" class="b">User action: gives a subjective usefulness rating.</text><text x="22" y="296" class="b">System response: requires one rating to save.</text><text x="22" y="355" class="b">The rating is kept separate from correctness.</text><text x="22" y="389" class="s">Principle: user-centred evaluation</text></g>
 <path d="M490 335 H525" stroke="#6c9594" stroke-width="3" marker-end="url(#a)"/>
 <g transform="translate(535,125)"><rect width="430" height="420" rx="19" fill="#fff" stroke="#d7e4e2" stroke-width="2"/><circle cx="34" cy="35" r="16" fill="#167b75"/><text x="34" y="40" text-anchor="middle" class="num">2</text><text x="62" y="41" class="h">Add an optional reason</text><rect x="22" y="77" width="386" height="104" rx="12" fill="#f7faf9" stroke="#e2ece9"/><rect x="40" y="96" width="12" height="12" rx="3" fill="#167b75"/><text x="63" y="107" class="b">A relevant clue was missing</text><rect x="40" y="124" width="12" height="12" rx="3" fill="white" stroke="#a6b8bc"/><text x="63" y="135" class="b">The cue was misleading</text><rect x="40" y="152" width="12" height="12" rx="3" fill="white" stroke="#a6b8bc"/><text x="63" y="163" class="b">The limitation was unclear</text><rect x="22" y="204" width="386" height="66" rx="9" fill="white" stroke="#d7e4e2"/><text x="40" y="231" class="b">Comment (optional, max 500 characters)</text><text x="22" y="310" class="b">User action: picks an issue tag and/or comments.</text><text x="22" y="338" class="b">System response: validates and saves the feedback.</text><text x="22" y="389" class="s">Principle: error reporting and accountability</text></g>
 <path d="M980 335 H1015" stroke="#6c9594" stroke-width="3" marker-end="url(#a)"/>
 <g transform="translate(1025,125)"><rect width="430" height="420" rx="19" fill="#fff" stroke="#d7e4e2" stroke-width="2"/><circle cx="34" cy="35" r="16" fill="#167b75"/><text x="34" y="40" text-anchor="middle" class="num">3</text><text x="62" y="41" class="h">Inspect and export</text><rect x="22" y="78" width="386" height="88" rx="12" fill="#edf8f2" stroke="#c6e6d5"/><text x="42" y="110" class="mini">FEEDBACK RECORDED</text><text x="42" y="139" class="h">Saved in this browser</text><text x="22" y="213" class="b">Session summary counts reviewed cases.</text><text x="22" y="241" class="b">CSV export supports later inspection.</text><text x="22" y="269" class="b">Clear session removes local records.</text><text x="22" y="326" class="b">No data is sent to a server.</text><text x="22" y="355" class="b">Feedback does not retrain the simulated AI.</text><text x="22" y="389" class="s">Principle: visibility and user control</text></g>
</svg>
